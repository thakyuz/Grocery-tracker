[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-deals"
version = "0.1.0"
description = "Weekly digest of grocery deals on the items you actually buy (Safeway, Fred Meyer, QFC, Metropolitan Market, Grocery Outlet)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "anthropic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grocery = "grocery_deals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
